<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Google Drive Reader</title>
    <!-- โหลด Google Identity Services Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <h2>ดึงไฟล์จาก Google Drive ของคุณ</h2>
    
    <button id="login-btn" onclick="handleAuth()">เข้าสู่ระบบด้วย Google</button>
    <button id="logout-btn" onclick="handleLogout()" style="display:none;">ออกจากระบบ</button>

    <h3>รายการไฟล์ของคุณ:</h3>
    <ul id="file-list"></ul>

    <script>
        // 1. ใส่ Client ID ของคุณที่ได้จาก Google Cloud Console
        const CLIENT_ID = '1038054071398-dbj2ioo6i8fhie12g31oh16u2ac39go0.apps.googleusercontent.com';
        
        // 2. กำหนด Scope (สิทธิ์เข้าถึง) 
        // แนะนำใช้ drive.readonly เพื่ออ่านข้อมูลอย่างเดียว (ปลอดภัยที่สุด)
        const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';

        let tokenClient;
        let accessToken = null;

        // เริ่มต้นการใช้งาน Google Auth Client
        window.onload = function() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        accessToken = tokenResponse.access_token;
                        document.getElementById('login-btn').style.display = 'none';
                        document.getElementById('logout-btn').style.display = 'inline-block';
                        // เมื่อได้ Token แล้ว ให้ไปดึงไฟล์จาก Drive
                        fetchDriveFiles();
                    }
                },
            });
        };

        // กดปุ่ม Login
        function handleAuth() {
            // ขอ Access Token จากผู้ใช้
            tokenClient.requestAccessToken();
        }

        // กดปุ่ม Logout
        function handleLogout() {
            if (accessToken) {
                google.accounts.oauth2.revoke(accessToken, () => {
                    accessToken = null;
                    document.getElementById('file-list').innerHTML = '';
                    document.getElementById('login-btn').style.display = 'inline-block';
                    document.getElementById('logout-btn').style.display = 'none';
                    alert('ออกจากระบบเรียบร้อย');
                });
            }
        }

        // ดึงข้อมูลไฟล์จาก Google Drive API
        function fetchDriveFiles() {
            fetch('https://www.googleapis.com/drive/v3/files?pageSize=15&fields=files(id, name, mimeType, webViewLink)', {
                headers: {
                    'Authorization': `Bearer ${accessToken}`
                }
            })
            .then(response => response.json())
            .then(data => {
                const fileList = document.getElementById('file-list');
                fileList.innerHTML = '';

                if (data.files && data.files.length > 0) {
                    data.files.forEach(file => {
                        const li = document.createElement('li');
                        li.innerHTML = `<a href="${file.webViewLink}" target="_blank">${file.name}</a> (${file.mimeType})`;
                        fileList.appendChild(li);
                    });
                } else {
                    fileList.innerHTML = '<li>ไม่พบไฟล์ใน Google Drive ของคุณ</li>';
                }
            })
            .catch(error => {
                console.error('Error fetching files:', error);
            });
        }
    </script>
</body>
</html>
